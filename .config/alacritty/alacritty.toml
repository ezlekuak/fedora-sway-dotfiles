[general]
import = ["~/.config/alacritty/themes/themes/gruvbox_material_medium_dark.toml"]
[env]
TERM = "xterm-256color"
[font]
size = 12.0
[font.bold]
family = "FiraMono Nerd Font"
style = "Bold"
[font.bold_italic]
family = "FiraMono Nerd Font"
style = "Bold Italic"
[font.italic]
family = "FiraMono Nerd Font"
style = "Italic"
[font.normal]
family = "FiraMono Nerd Font"
style = "Regular"

[scrolling]
history = 5000

[window]
dynamic_padding = false
opacity = 0.85
title = "Alacritty"

[window.class]
general = "Alacritty"
instance = "Alacritty"

[window.padding]
x = 6
y = 6
